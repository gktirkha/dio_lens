<!doctype html>
<!--
  Open Design · OD Next handheld shell — platform-neutral phone (restrained camera dot and symmetric side keys — use when the brief names no platform).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->
<html lang="en" data-theme="dark">
<head><script type="application/json" data-od-external-dependencies>["https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"]</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dio Lens — network inspector prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Native hidden remains authoritative over component flex/grid styles. */
    [hidden]:not([hidden="until-found" i]) { display: none !important; }

    :root {
      --phone-screen-width: 390px;
      --phone-screen-height: 844px;
      --phone-bezel: 10px;
      --phone-outer-radius: 52px;
      --phone-screen-radius: 42px;
      --phone-safe-top: 50px;
      --phone-safe-bottom: 29px;
      --phone-system-fg: #eef0f4;
      --phone-screen-bg: #0b0d12;
      --phone-stage-bg: #191b20;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.05), transparent 40%),
        var(--phone-stage-bg, #191b20);
      color: #e7e9ee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width, 390px) + var(--phone-bezel, 10px) * 2);
      height: calc(var(--phone-screen-height, 844px) + var(--phone-bezel, 10px) * 2);
      padding: var(--phone-bezel, 10px);
      border-radius: var(--phone-outer-radius, 52px);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
        linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.85),
        0 32px 68px -20px rgba(10,12,16,.52),
        0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 96px;
      bottom: 96px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width, 390px);
      height: var(--phone-screen-height, 844px);
      overflow: hidden;
      border-radius: var(--phone-screen-radius, 42px);
      background: var(--phone-screen-bg, #0b0d12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top, 50px);
      padding-bottom: var(--phone-safe-bottom, 29px);
      background: var(--phone-screen-bg, #0b0d12);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .camera-dot {
      position: absolute;
      z-index: 20;
      top: 13px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top, 50px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: start;
      padding: 14px 20px 0;
      color: var(--phone-system-fg, #eef0f4);
      opacity: .92;
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 15px;
      font-size: 14px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 56px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 15px;
      gap: 6px;
    }
    .status-icons svg {
      display: block;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .status-icons .connectivity { width: 15px; height: 12px; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .battery { width: 19px; height: 11px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 96px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg, #eef0f4);
      opacity: .7;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

    /* ===================================================================
       OD-LAYOUT-PRIMITIVES v1 — structure only. Kept verbatim from
       .od-frames/layout.css, @layer first so product CSS below wins. */
    @layer od-layout {
      [hidden]:not([hidden="until-found" i]) { display: none !important; }
      dialog:not([open]) { display: none !important; }

      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap  { white-space: nowrap; }
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

      .od-screen { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    :root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    /* ===================================================================
       Dio Lens product tokens — kept in their own :root block, separate
       from the --phone-* shell variables above. Dark is the primary theme;
       light overrides live on .dl-app[data-theme="light"] so overlays that
       mount outside .dl-app (dialogs, toasts) still see the active values
       because every token is read from :root downward, never re-scoped. */
    :root {
      --dl-bg: #0b0d12;
      --dl-surface: #12151c;
      --dl-surface-2: #181c25;
      --dl-surface-3: #1f2430;
      --dl-border: #262b37;
      --dl-border-strong: #333a4c;
      --dl-text: #e7e9ee;
      --dl-text-muted: #9099ad;
      --dl-text-faint: #5b6273;
      --dl-accent: #5b8cff;
      --dl-accent-strong: #90b0ff;
      --dl-on-accent: #0b1020;
      --dl-success: #36c976;
      --dl-success-bg: rgba(54,201,118,.15);
      --dl-redirect: #4da3ff;
      --dl-redirect-bg: rgba(77,163,255,.15);
      --dl-warn: #f3ab35;
      --dl-warn-bg: rgba(243,171,53,.16);
      --dl-danger: #f35468;
      --dl-danger-bg: rgba(243,84,104,.15);
      --dl-pending: #9099ad;
      --dl-pending-bg: rgba(144,153,173,.14);
      --dl-shadow: 0 10px 28px rgba(0,0,0,.4);
      --dl-font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --dl-font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      --dl-r-sm: 8px;
      --dl-r-md: 12px;
      --dl-r-lg: 20px;
      --m-get: #4da3ff; --m-get-bg: rgba(77,163,255,.16);
      --m-post: #36c976; --m-post-bg: rgba(54,201,118,.16);
      --m-put: #f3ab35; --m-put-bg: rgba(243,171,53,.18);
      --m-patch: #b084f5; --m-patch-bg: rgba(176,132,245,.18);
      --m-delete: #f35468; --m-delete-bg: rgba(243,84,104,.16);
      --m-query: #2dd4bf; --m-query-bg: rgba(45,212,191,.16);
      --dl-jt-key: #8fb0ff;
    }
    /* Theme is toggled on the document root (not .dl-app) so overlays that
       mount outside .dl-app — the settings sheet, toasts — still inherit
       the active theme's custom properties. */
    :root[data-theme="light"] {
      --dl-bg: #f3f4f7;
      --dl-surface: #ffffff;
      --dl-surface-2: #f8f9fb;
      --dl-surface-3: #eef0f4;
      --dl-border: #e1e3ea;
      --dl-border-strong: #c7cbd6;
      --dl-text: #161a22;
      --dl-text-muted: #5b6273;
      --dl-text-faint: #8891a3;
      --dl-accent: #2f63e0;
      --dl-accent-strong: #1d49b8;
      --dl-on-accent: #ffffff;
      --dl-success: #178a4c;
      --dl-success-bg: rgba(23,138,76,.12);
      --dl-redirect: #1d6fe0;
      --dl-redirect-bg: rgba(29,111,224,.1);
      --dl-warn: #a86309;
      --dl-warn-bg: rgba(168,99,9,.13);
      --dl-danger: #c92e49;
      --dl-danger-bg: rgba(201,46,73,.1);
      --dl-pending: #5b6273;
      --dl-pending-bg: rgba(91,98,115,.1);
      --dl-shadow: 0 10px 24px rgba(30,34,45,.12);
      --m-get: #1d6fe0; --m-get-bg: rgba(29,111,224,.1);
      --m-post: #178a4c; --m-post-bg: rgba(23,138,76,.1);
      --m-put: #a86309; --m-put-bg: rgba(168,99,9,.12);
      --m-patch: #7c3aed; --m-patch-bg: rgba(124,58,237,.1);
      --m-delete: #c92e49; --m-delete-bg: rgba(201,46,73,.1);
      --m-query: #0f7d76; --m-query-bg: rgba(15,125,118,.1);
      --dl-jt-key: #1d49b8;
    }

    /* Reduced motion: shorten everything, but keep the loading spinner
       legible as a state signal rather than removing it outright. */
    @media (prefers-reduced-motion: reduce) {
      .dl-app *, .dl-app *::before, .dl-app *::after,
      #dl-overlay-root *, #dl-overlay-root *::before, #dl-overlay-root *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
      .dl-app .dl-spinner, #dl-overlay-root .dl-spinner { animation-duration: 1.6s !important; }
    }

    /* ===================================================================
       Base + typography */
    .dl-app {
      position: relative;
      height: 100%;
      background: var(--dl-bg);
      color: var(--dl-text);
      font-family: var(--dl-font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .dl-app button { font-family: inherit; color: inherit; }
    .dl-app h1, .dl-app h2, .dl-app h3, .dl-app p { margin: 0; }
    .dl-mono { font-family: var(--dl-font-mono); }
    .dl-screen { min-height: 100%; }

    .dl-icon { display:inline-block; inline-size: var(--od-icon-size,1em); block-size: var(--od-icon-size,1em); flex:none;
               fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .dl-icon.filled-dots circle[fill] { fill: currentColor; stroke: none; }

    .dl-btn-icon {
      --od-icon-size: 19px;
      display: inline-flex; align-items:center; justify-content:center; flex:none;
      width: 36px; height: 36px; border-radius: 10px; border: none;
      background: transparent; color: var(--dl-text-muted); cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .dl-btn-icon:hover { background: var(--dl-surface-3); color: var(--dl-text); }
    .dl-btn-icon:focus-visible, .dl-app a:focus-visible, .dl-app button:focus-visible, .dl-app input:focus-visible,
    .dl-app select:focus-visible, .dl-app [tabindex]:focus-visible {
      outline: 2px solid var(--dl-accent); outline-offset: 2px;
    }
    .dl-btn-icon[disabled] { opacity: .4; cursor: default; pointer-events: none; }

    @keyframes dl-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .dl-enter { animation: dl-fade-up .22s ease-out both; }

    @keyframes dl-spin { to { transform: rotate(360deg); } }
    .dl-spinner {
      width: 16px; height: 16px; border-radius: 50%; flex: none;
      border: 2px solid var(--dl-border-strong); border-top-color: var(--dl-accent);
      animation: dl-spin .8s linear infinite;
    }

    /* ---- Host sample app (entry point背景) + floating bubble ---- */
    .dl-host { min-height: 100%; padding: 22px 20px 40px; background:
      linear-gradient(180deg, #121521 0%, #0c0e15 60%, #0a0b10 100%); color: #e7e9ee; }
    .dl-host .host-eyebrow { margin:0 0 6px; color:#7a84a0; font-size:12px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
    .dl-host h1 { font-size: 26px; line-height:1.18; letter-spacing:-.02em; font-weight:800; }
    .dl-host .host-sub { margin: 10px 0 24px; color:#9aa2b8; line-height:1.55; font-size: 13.5px; }
    .host-card { padding: 16px; border: 1px solid #242837; border-radius: 16px; background: #161925; box-shadow: 0 8px 22px rgba(0,0,0,.28); }
    .host-card + .host-card { margin-top: 12px; }
    .host-card .host-row { display:flex; align-items:center; gap:12px; }
    .host-card .host-chip { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; background:#1f2538; color:#8fb0ff; flex:none; }
    .host-card .host-chip.alt { background:#20291f; color:#7fd79e; }
    .host-card .host-chip.warn { background:#2b2419; color:#e0ac55; }
    .host-card .host-title { font-weight:650; font-size:14px; }
    .host-card .host-meta { color:#8089a0; font-size:12.5px; margin-top:2px; }
    .host-skeleton { height:12px; border-radius:6px; background:#20242f; margin-top:8px; }
    .host-skeleton.w60 { width:60%; } .host-skeleton.w80{ width:80%; } .host-skeleton.w40{ width:40%; }
    .host-sim-btn {
      --od-icon-size:17px;
      width:100%; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px;
      height:46px; border-radius:14px; border:1px dashed #3a4566; background:transparent; color:#9db2ff;
      font-size:13.5px; font-weight:650; font-family:inherit; cursor:pointer;
    }
    .host-sim-btn:hover { background:#141a2c; border-color:#4d5c8c; }
    .host-sim-btn:active { transform: scale(.98); }

    #dl-bubble-root { position: absolute; inset: 0; pointer-events: none; }
    .dl-bubble-wrap { position: absolute; z-index: 40; pointer-events: auto; }
    .dl-bubble-wrap.pos-br { right: 16px; bottom: 112px; }
    .dl-bubble-wrap.pos-bl { left: 16px; bottom: 112px; }
    .dl-bubble-wrap.pos-tr { right: 16px; top: calc(var(--phone-safe-top, 50px) + 16px); }
    .dl-bubble-wrap.pos-tl { left: 16px; top: calc(var(--phone-safe-top, 50px) + 16px); }
    .dl-bubble {
      --od-icon-size: 22px;
      position: relative; width: 56px; height: 56px; border-radius: 50%;
      display:grid; place-items:center; border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(155deg, #3c6dff 0%, #203bb8 100%);
      color:#eef2ff; cursor:pointer; box-shadow: 0 10px 26px rgba(39,65,180,.55), 0 2px 0 rgba(255,255,255,.12) inset;
      transition: transform .18s ease;
    }
    .dl-bubble:hover { transform: translateY(-2px) scale(1.03); }
    .dl-bubble:active { transform: scale(.96); }

    /* ---- Top bar ---- */
    .dl-topbar {
      position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--dl-bg) 88%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--dl-border);
      padding: 10px 10px 10px 16px;
    }
    .dl-topbar .tb-row { display:flex; align-items:center; gap:4px; flex-wrap:nowrap; }
    .dl-topbar .tb-brand { display:flex; align-items:center; gap:9px; min-width:0; flex:1 1 auto; }
    .dl-topbar .tb-mark {
      --od-icon-size: 16px;
      width: 28px; height: 28px; border-radius: 9px; display:grid; place-items:center;
      background: linear-gradient(155deg, #3c6dff, #203bb8); color:#eef2ff; flex:none;
    }
    .dl-topbar h1 {
      font-size: 17px; font-weight: 750; letter-spacing: -.01em; min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .dl-topbar .tb-actions { margin-left:auto; display:flex; align-items:center; gap:2px; position: relative; flex:none; }
    .dl-search-row { display:flex; align-items:center; gap:8px; padding: 2px 6px 10px; }
    .dl-search-field {
      flex:1; display:flex; align-items:center; gap:8px; height:38px; padding: 0 12px;
      border-radius: var(--dl-r-md); background: var(--dl-surface-2); border: 1px solid var(--dl-border);
    }
    .dl-search-field input {
      flex:1; min-width:0; border:none; background:transparent; color:var(--dl-text); font-size:14px; font-family:var(--dl-font-sans);
    }
    .dl-search-field input::placeholder { color: var(--dl-text-faint); }
    .dl-search-field input:focus { outline:none; }
    .dl-search-field .dl-icon { color: var(--dl-text-faint); --od-icon-size:17px; }

    /* segmented filters */
    .dl-segmented { display:flex; gap:6px; padding: 10px 16px 12px; overflow-x:auto; scrollbar-width:none; }
    .dl-segmented::-webkit-scrollbar { display:none; }
    .dl-seg-btn {
      flex:none; height:30px; padding:0 13px; border-radius:999px; border:1px solid var(--dl-border);
      background: var(--dl-surface-2); color: var(--dl-text-muted); font-size:12.5px; font-weight:600; cursor:pointer;
      display:inline-flex; align-items:center; gap:6px; transition: background .15s, color .15s, border-color .15s;
    }
    .dl-seg-btn[aria-selected="true"] { background: var(--dl-accent); border-color: var(--dl-accent); color: var(--dl-on-accent); }
    .dl-seg-btn[aria-selected="true"] .count { opacity:.85; }

    /* ---- Popovers (method filter / overflow menu / confirm) ---- */
    .dl-popover {
      position:absolute; top: 46px; right: 0; z-index: 30; min-width: 198px;
      background: var(--dl-surface-2); border:1px solid var(--dl-border); border-radius: var(--dl-r-md);

    }
    .dl-popover.wide { min-width: 232px; }
    .dl-pop-item {
      width:100%; display:flex; align-items:center; gap:10px; padding: 9px 10px; border-radius:8px;
      background:transparent; border:none; color:var(--dl-text); font-size:13.5px; text-align:left; cursor:pointer;
    }
    .dl-pop-item:hover { background: var(--dl-surface-3); }
    .dl-pop-item .dl-icon { --od-icon-size:16px; color: var(--dl-text-muted); flex:none; }
    .dl-pop-item.danger { color: var(--dl-danger); }

    .dl-pop-sep { height:1px; background:var(--dl-border); margin: 4px 2px; }

    .dl-pop-title { padding: 8px 10px 4px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--dl-text-faint); }
    .dl-confirm-box { padding: 12px 12px 10px; }
    .dl-confirm-box p { font-size: 13px; color: var(--dl-text-muted); margin-bottom: 10px; line-height:1.4; }
    .dl-confirm-actions { display:flex; gap:8px; justify-content:flex-end; }
    .dl-btn-sm { height:32px; padding:0 13px; border-radius:8px; font-size:12.5px; font-weight:650; cursor:pointer; border:1px solid var(--dl-border); background:var(--dl-surface-3); color:var(--dl-text); }
    .dl-btn-sm.danger { background: var(--dl-danger); border-color: var(--dl-danger); color:#fff; }

    /* ---- Request list ---- */
    .dl-group-label { padding: 14px 16px 6px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--dl-text-faint); }
    .dl-list { padding: 0 0 18px; }
    .dl-row-swipe { position:relative; overflow:hidden; }

    .dl-row-delete {
      position:absolute; inset:0 0 0 auto; width:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;

    }
    .dl-row-delete .dl-icon { --od-icon-size:18px; }
    .dl-row-content {
      position:relative; width:100%; display:block; text-align:left; border:none; background: var(--dl-bg); color: var(--dl-text);

    }
    .dl-row-content:hover { background: var(--dl-surface-2); }
    .dl-row-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .dl-chip {
      flex:none; height:21px; padding:0 8px; border-radius:6px; font-size:11px; font-weight:750; letter-spacing:.02em;
      display:inline-flex; align-items:center; font-family: var(--dl-font-mono);
    }
    .dl-chip.GET { background: var(--m-get-bg); color: var(--m-get); }
    .dl-chip.POST { background: var(--m-post-bg); color: var(--m-post); }
    .dl-chip.PUT { background: var(--m-put-bg); color: var(--m-put); }
    .dl-chip.PATCH { background: var(--m-patch-bg); color: var(--m-patch); }
    .dl-chip.DELETE { background: var(--m-delete-bg); color: var(--m-delete); }
    .dl-chip.QUERY { background: var(--m-query-bg); color: var(--m-query); }
    .dl-badge { flex:none; height:21px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:700; font-family:var(--dl-font-mono); display:inline-flex; align-items:center; gap:4px; }
    .dl-badge.c2xx { background: var(--dl-success-bg); color: var(--dl-success); }
    .dl-badge.c3xx { background: var(--dl-redirect-bg); color: var(--dl-redirect); }
    .dl-badge.c4xx { background: var(--dl-warn-bg); color: var(--dl-warn); }
    .dl-badge.c5xx { background: var(--dl-danger-bg); color: var(--dl-danger); }
    .dl-badge.cpending { background: var(--dl-pending-bg); color: var(--dl-pending); }
    .dl-badge.cerror { background: var(--dl-danger-bg); color: var(--dl-danger); }
    .dl-badge .dl-icon { --od-icon-size:12px; }
    .dl-row-time { margin-left:auto; flex:none; font-size:11.5px; color: var(--dl-text-faint); font-variant-numeric: tabular-nums; }
    .dl-row-path { font-size: 14px; font-weight: 650; font-family: var(--dl-font-mono); }
    .dl-row-host { font-size: 12px; color: var(--dl-text-muted); margin-top: 2px; font-family: var(--dl-font-mono); }
    .dl-row-meta { margin-top:6px; display:flex; align-items:center; gap:10px; font-size:11.5px; color: var(--dl-text-faint); font-variant-numeric: tabular-nums; }
    .dl-row-meta .dl-icon { --od-icon-size:12px; margin-right:2px; }
    .dl-row-meta .dl-err-text { color: var(--dl-danger); font-weight:600; }

    .dl-empty { display:grid; justify-items:center; gap:10px; padding: 70px 36px 40px; text-align:center; }

    .dl-empty p { font-size:12.5px; color: var(--dl-text-muted); line-height:1.5; }

    /* ---- Bottom nav ---- */
    .dl-bottomnav {

    /* ---- Detail screen ---- */

    .dl-dh-top { display:flex; align-items:flex-start; gap:4px; }
    .dl-dh-url { flex:1; min-width:0; padding-top:4px; }

    .dl-dh-path { font-family: var(--dl-font-mono); font-size:15px; font-weight:700; overflow-wrap:anywhere; }
    .dl-dh-host { font-family: var(--dl-font-mono); font-size:12px; color: var(--dl-text-muted); margin-top:3px; overflow-wrap:anywhere; }
    .dl-dh-stats { display:flex; align-items:center; gap:14px; margin: 12px 0 12px; font-size:12px; color:var(--dl-text-muted); flex-wrap:wrap; }
    .dl-dh-stats .dl-icon { --od-icon-size:13px; margin-right:3px; }
    .dl-dh-actions { display:flex; gap:8px; padding-bottom: 12px; }
    .dl-act-btn {
      flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:36px; border-radius:10px;
      border:1px solid var(--dl-border); background: var(--dl-surface-2); color: var(--dl-text); font-size:12.5px; font-weight:650; cursor:pointer;
    }

    .dl-tabs { display:flex; gap:4px; padding: 0 10px; }

      flex:1; text-align:center; padding: 11px 4px; border:none; background:transparent; color:var(--dl-text-faint);
      font-size:12.5px; font-weight:650; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
    }
    .dl-tab[aria-selected="true"] { color: var(--dl-accent); border-bottom-color: var(--dl-accent); }

    .dl-tabpanel { padding: 16px; }
    .dl-kv-grid { display:grid; grid-template-columns: 112px 1fr; gap: 10px 12px; }
    .dl-kv-grid dt { font-size:12px; color: var(--dl-text-faint); padding-top:1px; }
    .dl-kv-grid dd { margin:0; font-size:13px; font-family: var(--dl-font-mono); overflow-wrap:anywhere; }
    .dl-kv-grid dd.status-ok { color: var(--dl-success); font-weight:700; }
    .dl-kv-grid dd.status-warn { color: var(--dl-warn); font-weight:700; }
    .dl-kv-grid dd.status-bad { color: var(--dl-danger); font-weight:700; }
    .dl-overview { display:flex; flex-direction:column; gap:14px; }
    .dl-ov-item { display:flex; flex-direction:column; gap:6px; }
    .dl-ov-label { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color: var(--dl-text-faint); }
    .dl-ov-value { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--dl-border); background: color-mix(in srgb, var(--dl-surface-2) 60%, transparent); text-align:left; font:12.5px/1.6 var(--dl-font-mono); color: var(--dl-text); word-break:break-all; cursor:pointer; width:100%; }
    .dl-ov-value:hover { background: color-mix(in srgb, var(--dl-surface-3) 70%, transparent); }
    .dl-ov-value.static { cursor:default; }
    .dl-ov-value.static:hover { background: color-mix(in srgb, var(--dl-surface-2) 60%, transparent); }
    .dl-ov-value.status-ok { color: var(--dl-success); }
    .dl-ov-value.status-warn { color: var(--dl-warn); }
    .dl-ov-value.status-bad { color: var(--dl-danger); }
    .dl-ov-val-text { flex:1; min-width:0; }
    .dl-ov-copy { color: var(--dl-text-faint); display:inline-flex; align-items:center; flex:none; }
    .dl-ov-value:hover .dl-ov-copy { color: var(--dl-text); }
    .dl-ov-box { border:1px solid var(--dl-border); border-radius:12px; overflow:hidden; background: color-mix(in srgb, var(--dl-surface-2) 50%, transparent); }
    .dl-ov-box-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--dl-border); background: color-mix(in srgb, var(--dl-surface-2) 70%, transparent); }
    .dl-ov-box-header span { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color: var(--dl-text-faint); }
    .dl-ov-box-copy { display:inline-flex; align-items:center; gap:6px; border:none; background:transparent; color: var(--dl-text-faint); font-size:11px; cursor:pointer; padding:2px 6px; border-radius:6px; }
    .dl-ov-box-copy:hover { color: var(--dl-text); background: color-mix(in srgb, var(--dl-surface-3) 60%, transparent); }
    .dl-ov-kv-list { display:flex; flex-direction:column; }
    .dl-ov-kv { display:flex; flex-direction:column; gap:4px; padding:10px 12px; text-align:left; width:100%; cursor:pointer; border:none; background:transparent; border-top:1px solid var(--dl-border); }
    .dl-ov-kv:first-child { border-top:none; }
    .dl-ov-kv:hover { background: color-mix(in srgb, var(--dl-surface-3) 60%, transparent); }
    .dl-ov-kv-key { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color: var(--dl-text-faint); }
    .dl-ov-kv-val { font:12.5px/1.6 var(--dl-font-mono); color: var(--dl-text); word-break:break-all; text-align:left; }
    .dl-ov-kv-val.redacted { letter-spacing:2px; }
    .dl-tabstack { display:flex; flex-direction:column; gap:14px; }
    .dl-body-wrap { display:flex; flex-direction:column; gap:10px; }
    .dl-curl-section { display:flex; flex-direction:column; gap:10px; margin-top:4px; padding:12px; border-radius:12px; border:1px solid var(--dl-border); background: color-mix(in srgb, var(--dl-surface-2) 50%, transparent); }
    .dl-curl-header { display:flex; align-items:center; justify-content:space-between; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color: var(--dl-text-faint); }
    .dl-curl-pre { margin:0; padding:10px 12px; border-radius:10px; background: color-mix(in srgb, var(--dl-surface) 80%, transparent); border:1px solid var(--dl-border); overflow-x:auto; }
    .dl-curl-pre code { font:11.5px/1.7 var(--dl-font-mono); color: var(--dl-text); white-space:pre; display:block; }

    .dl-section { border:1px solid var(--dl-border); border-radius: var(--dl-r-md); margin-bottom:12px; overflow:hidden; background: var(--dl-surface); }
    .dl-section-head {
      width:100%; display:flex; align-items:center; gap:8px; padding: 11px 13px; border:none; background: var(--dl-surface-2);
      color: var(--dl-text); font-size:13px; font-weight:650; cursor:pointer;

    .dl-section-head .chev { --od-icon-size:16px; color: var(--dl-text-faint); transition: transform .18s ease; flex:none; }
    .dl-section-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .dl-section-body { padding: 10px 13px 13px; }
    .dl-kv-mono { display:grid; grid-template-columns: minmax(0,1fr); gap:9px; }
    .dl-kv-mono .row { display:grid; gap:2px; }
    .dl-kv-mono .k { font-size:11px; color: var(--dl-text-faint); font-family: var(--dl-font-mono); }
    .dl-kv-mono .v { font-size:12.5px; font-family: var(--dl-font-mono); overflow-wrap:anywhere; }

    .dl-body-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; }

    .dl-body-ct-tag { font-size:11px; font-weight:700; color: var(--dl-text-faint); text-transform:uppercase; letter-spacing:.03em; }
    .dl-copy-btn { margin-left:auto; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--dl-border); background:var(--dl-surface-2); color:var(--dl-text-muted); border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:600; cursor:pointer; }
    .dl-copy-btn .dl-icon { --od-icon-size:13px; }
    .dl-copy-btn:hover { color: var(--dl-text); }

    .dl-json-raw { font-family: var(--dl-font-mono); font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; color: var(--dl-text); padding:12px; background: color-mix(in srgb, var(--dl-surface-2) 40%, transparent); border:1px solid var(--dl-border); border-radius:10px; }
    .dl-json-tree { font-family: var(--dl-font-mono); font-size:12px; line-height:1.7; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:12px; background: color-mix(in srgb, var(--dl-surface-2) 40%, transparent); border:1px solid var(--dl-border); border-radius:10px; }

    .dl-json-tree .jt-toggle .dl-icon { --od-icon-size:10px; }
    .dl-json-tree .jt-toggle-spacer { flex:none; width:16px; height:16px; display:inline-block; }
    .dl-json-tree .jt-key { color: var(--dl-jt-key); }

    .dl-json-tree .jt-punct { color: var(--dl-text-faint); }
    .dl-json-tree .jt-count { color: var(--dl-text-faint); font-size:11px; margin-left:4px; }
    .dl-json-tree .jt-img { display:inline-flex; align-items:center; gap:4px; border:none; background:transparent; padding:0; margin:0; cursor:pointer; font:inherit; }
    .dl-json-tree .jt-img .dl-icon { --od-icon-size:12px; color: var(--dl-accent); flex:none; }
    .dl-json-tree .jt-img .jt-str { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--dl-accent) 55%, transparent); text-underline-offset:2px; }
    .dl-json-tree .jt-img:hover .jt-str { color: var(--dl-accent); }

    .dl-image-preview { border:1px solid var(--dl-border); border-radius: var(--dl-r-md); overflow:hidden; background: var(--dl-surface); }
    .dl-image-ph {
      aspect-ratio: 1; display:grid; place-items:center; gap:8px;
      background: repeating-linear-gradient(45deg, var(--dl-surface-2) 0 10px, var(--dl-surface-3) 10px 20px);
      color: var(--dl-text-faint);
    }
    .dl-image-ph .dl-icon { --od-icon-size:30px; }
    .dl-image-ph span { font-size:11px; }
    .dl-image-meta { padding: 9px 12px; font-size:11.5px; color: var(--dl-text-muted); font-family: var(--dl-font-mono); display:flex; justify-content:space-between; }

    .dl-waterfall { padding: 4px 0 2px; }

    .dl-wf-seg { height:100%; }
    .dl-wf-legend { display:grid; gap:9px; }
    .dl-wf-item { display:flex; align-items:center; gap:9px; font-size:12.5px; }
    .dl-wf-dot { width:10px; height:10px; border-radius:3px; flex:none; }
    .dl-wf-item .lbl { flex:1; color: var(--dl-text-muted); }
    .dl-wf-item .ms { font-family: var(--dl-font-mono); font-weight:600; font-variant-numeric: tabular-nums; }
    .dl-wf-total { margin-top:12px; padding-top:12px; border-top:1px solid var(--dl-border); display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }

    .dl-error-card { border:1px solid var(--dl-danger); background: var(--dl-danger-bg); border-radius: var(--dl-r-md); padding:14px; margin-bottom:14px; }
    .dl-error-card .et-type { font-family: var(--dl-font-mono); font-size:12px; font-weight:700; color: var(--dl-danger); display:flex; align-items:center; gap:7px; }
    .dl-error-card .et-type .dl-icon { --od-icon-size:16px; }
    .dl-error-card .et-msg { margin-top:8px; font-size:13px; color: var(--dl-text); line-height:1.5; }
    .dl-stack { background: var(--dl-surface); border:1px solid var(--dl-border); border-radius: var(--dl-r-md); padding:12px; font-family: var(--dl-font-mono); font-size:11.5px; line-height:1.7; color: var(--dl-text-muted); overflow-x:auto; white-space:pre; }

    /* ---- Stats dashboard ---- */
    .dl-stats-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px 16px 6px; }
    .dl-stat-card { border:1px solid var(--dl-border); background: var(--dl-surface); border-radius: var(--dl-r-md); padding: 13px 14px; }
    .dl-stat-card .lbl { font-size: 11px; color: var(--dl-text-faint); font-weight:650; letter-spacing:.02em; }
    .dl-stat-card .val { font-size: 21px; font-weight: 800; margin-top:5px; font-variant-numeric: tabular-nums; letter-spacing:-.01em; }
    .dl-stat-card .val.ok { color: var(--dl-success); }
    .dl-stat-card .val.bad { color: var(--dl-danger); }
    .dl-stat-card .sub { font-size:11px; color: var(--dl-text-faint); margin-top:3px; }

    .dl-panel { margin: 10px 16px 16px; border:1px solid var(--dl-border); background: var(--dl-surface); border-radius: var(--dl-r-lg); padding: 15px; }

    .dl-panel-head {
      width:100%; display:flex; align-items:center; gap:6px; border:none; background:transparent; padding:0; margin-bottom:12px; cursor:pointer; color: var(--dl-text);
    }

    .dl-donut-row { display:flex; align-items:center; gap:18px; }
    .dl-donut-row svg { flex:none; }
    .dl-legend { display:grid; gap:8px; flex:1; min-width:0; }
    .dl-legend-item { display:flex; align-items:center; gap:8px; font-size:12px; }
    .dl-legend-dot { width:9px; height:9px; border-radius:3px; flex:none; }
    .dl-legend-item .name { flex:1; color: var(--dl-text-muted); }

        try {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); done(true);
        } catch (e) { done(false); }
      }
    }
    function buildCurl(r) {
      var parts = ['curl -X ' + r.method, "'https://" + r.host + r.path + (r.query ? '?' + r.query : '') + "'"];
      Object.keys(r.reqHeaders || {}).forEach(function (k) { parts.push("-H '" + k + ': ' + r.reqHeaders[k] + "'"); });
      if (r.reqBody) {
        var isForm = /x-www-form-urlencoded/i.test(r.reqContentType || '') && typeof r.reqBody === 'object';
        var body = isForm
          ? Object.keys(r.reqBody).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(r.reqBody[k]); }).join('&')
          : typeof r.reqBody === 'string' ? r.reqBody : JSON.stringify(r.reqBody);
        parts.push("-d '" + body + "'");
      }
      return parts.join(' \\\n  ');
    }

    /* ---------------------------------------------------------------- JSON tree (collapsible) */
    function looksLikeImageUrl(v) {
      return /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(v) || /^data:image\//i.test(v);
    }
    function jsonTreeRoot(value, treeKey) {
      if (!state.openJsonPaths[treeKey]) {
        var seed = new Set(['$']);
        if (value && typeof value === 'object') {
          Object.keys(value).forEach(function (k) { seed.add('$.' + k); });
        }
        state.openJsonPaths[treeKey] = seed;
      }
      return '<div class="dl-json-tree" data-tree-key="' + esc(treeKey) + '">' + jsonNode(value, '$', treeKey, null) + '</div>';
    }
    function jsonNode(value, path, treeKey, keyLabel) {
      var openSet = state.openJsonPaths[treeKey];
      var isOpen = openSet.has(path);
      var keyHtml = keyLabel != null ? '<span class="jt-key">"' + esc(keyLabel) + '"</span><span class="jt-punct">: </span>' : '';
      if (Array.isArray(value)) {
        if (!value.length) return '<div class="jt-row">' + keyHtml + '<span class="jt-punct">[]</span></div>';
        var rowsA = value.map(function (v, i) { return jsonNode(v, path + '[' + i + ']', treeKey, null); }).join('');
        if (isOpen) {
          return '<div class="jt-item">' +
            '<div class="jt-row">' +
              '<button type="button" class="jt-toggle" data-action="toggle-json" data-path="' + esc(path) + '" data-tree-key="' + esc(treeKey) + '" aria-expanded="true">' + icon('chevronDown') + '</button>' +
              keyHtml + '<span class="jt-punct">[</span><span class="jt-count">' + value.length + ' items</span><span class="jt-punct">]</span>' +
            '</div>' +
            '<div class="jt-node">' + rowsA + '</div>' +
            '</div>';
        } else {
          return '<div class="jt-row">' +
            '<button type="button" class="jt-toggle" data-action="toggle-json" data-path="' + esc(path) + '" data-tree-key="' + esc(treeKey) + '" aria-expanded="false">' + icon('chevronRight') + '</button>' +
            keyHtml + '<span class="jt-punct">[</span><span class="jt-count">' + value.length + ' items</span><span class="jt-punct">]</span>' +
            '</div>';
        }
      }
      if (value && typeof value === 'object') {
        var keys = Object.keys(value);
        if (!keys.length) return '<div class="jt-row">' + keyHtml + '<span class="jt-punct">{}</span></div>';
        var rowsO = keys.map(function (k) { return jsonNode(value[k], path + '.' + k, treeKey, k); }).join('');
        if (isOpen) {
          return '<div class="jt-item">' +
            '<div class="jt-row">' +
              '<button type="button" class="jt-toggle" data-action="toggle-json" data-path="' + esc(path) + '" data-tree-key="' + esc(treeKey) + '" aria-expanded="true">' + icon('chevronDown') + '</button>' +
              keyHtml + '<span class="jt-punct">{</span><span class="jt-count">' + keys.length + ' keys</span><span class="jt-punct">}</span>' +
            '</div>' +
            '<div class="jt-node">' + rowsO + '</div>' +
            '</div>';
        } else {
          return '<div class="jt-row">' +
            '<button type="button" class="jt-toggle" data-action="toggle-json" data-path="' + esc(path) + '" data-tree-key="' + esc(treeKey) + '" aria-expanded="false">' + icon('chevronRight') + '</button>' +
            keyHtml + '<span class="jt-punct">{</span><span class="jt-count">' + keys.length + ' keys</span><span class="jt-punct">}</span>' +
            '</div>';
        }
      }
      var rendered;
      if (typeof value === 'string' && looksLikeImageUrl(value)) {
        rendered = '<button type="button" class="jt-img" data-action="open-json-image" data-src="' + esc(value) + '">' + icon('image') + '<span class="jt-str">"' + esc(value) + '"</span></button>';
      } else if (typeof value === 'string') {
        rendered = '<span class="jt-str">"' + esc(value) + '"</span>';
      } else if (typeof value === 'number') {
        rendered = '<span class="jt-num">' + value + '</span>';
      } else if (typeof value === 'boolean') {
        rendered = '<span class="jt-bool">' + value + '</span>';
      } else {
        rendered = '<span class="jt-null">null</span>';
      }
      return '<div class="jt-row"><span class="jt-toggle-spacer" aria-hidden="true"></span>' + keyHtml + rendered + '</div>';
    }

    function segmented() {

    function renderRow(r, idx) {
      var triggerAttrs = 'data-action="open-detail" data-id="' + r.id + '" data-row-trigger="' + r.id + '"';

      if (r.statusClass === 'pending') {

      } else if (r.statusClass === 'error') {

        right = '<span class="dl-badge c' + r.statusClass + '">' + statusLabel(r) + '</span>';
      }

      if (r.statusClass === 'pending') {
        metaBits.push('<span>Waiting…</span>');
      } else if (r.statusClass === 'error') {
        metaBits.push('<span class="dl-err-text">' + esc(r.error.type.replace('DioExceptionType.', '')) + '</span>');
        metaBits.push('<span>' + fmtMs(r.duration) + '</span>');
      } else {
        metaBits.push('<span>' + fmtMs(r.duration) + '</span>');

    function bodyBlock(req, which) {
      var data = which === 'request' ? req.reqBody : req.resBody;

          '<div class="dl-image-ph">' + icon('image') + '<span>Preview placeholder — stock photo lookup unavailable</span></div>' +

    function jsonBodyBlock(req, which, data) {

    function copyableKvField(label, key, value) {
