      var copyKey = key == null ? label : key;
      return '<button type="button" class="dl-ov-kv" data-action="copy-text" data-copy="' + encodeURIComponent(str) + '" data-label="' + esc(copyKey) + ' copied">' +
        '<span class="dl-ov-kv-key">' + esc(key == null ? label : key) + '</span>' +
        '<span class="dl-ov-kv-val">' + esc(str) + '</span>' +
      '</button>';
    }
    function tabOverview(req) {
      var statusCls = req.statusClass === '2xx' ? 'status-ok' :
        req.statusClass === '4xx' ? 'status-warn' :
        (req.statusClass === '5xx' || req.statusClass === 'error') ? 'status-bad' : '';
      var statusText = statusLabel(req) + (req.statusClass==='error' ? ' · ' + req.error.type : '');
      var curlCmd = buildCurl(req);
      var fullUrl = 'https://' + req.host + req.path + (req.query ? '?' + req.query : '');
      var qobj = req.reqQuery || {};
      var qkeys = Object.keys(qobj);
      if (qkeys.length === 0 && req.query) {
        try {
          req.query.split('&').forEach(function (p) {
            if (!p) return;
            var parts = p.split('=');
            qobj[decodeURIComponent(parts[0])] = parts.slice(1).join('=');
          });
          qkeys = Object.keys(qobj);
        } catch (e) {}
      }
      var allQuery = qkeys.map(function (k) { return k + '=' + qobj[k]; }).join('&') || req.query || '';
      var qpHtml = qkeys.length
        ? '<div class="dl-ov-box">' +
            '<div class="dl-ov-box-header"><span>Query</span><button type="button" class="dl-ov-box-copy" data-action="copy-text" data-copy="' + encodeURIComponent(allQuery) + '" data-label="Query params copied">' + icon('copy') + ' Copy all</button></div>' +
            '<div class="dl-ov-kv-list">' + qkeys.map(function (k) { return copyableKvField('Query', k, qobj[k]); }).join('') + '</div>' +
          '</div>'
        : (req.query ? copyableField('Query params', req.query) : '');
      return '<div class="dl-overview">' +
        copyableField('Full URL', fullUrl) +
        copyableField('Host', req.host) +
        copyableField('Path', req.path) +
        (qpHtml ? '<div class="dl-ov-item"><div class="dl-ov-label">Query params</div>' + qpHtml + '</div>' : '') +
        copyableField('Method', req.method) +
        '<div class="dl-ov-item">' +
          '<div class="dl-ov-label">Status</div>' +
          '<div class="dl-ov-value static ' + statusCls + '">' + esc(statusText) + '</div>' +
        '</div>' +
        copyableField('Protocol', req.protocol) +
        copyableField('Start time', req.startTime) +
        copyableField('Duration', fmtMs(req.duration)) +
        copyableField('Request size', fmtBytes(req.reqSize)) +
        copyableField('Response size', fmtBytes(req.resSize)) +
        copyableField('Request type', req.reqContentType || '—') +
        copyableField('Response type', req.resContentType || '—') +
        '<div class="dl-curl-section">' +
          '<div class="dl-curl-header"><span>cURL</span></div>' +
          '<pre class="dl-curl-pre"><code>' + esc(curlCmd) + '</code></pre>' +
          '<button type="button" class="dl-curl-copy" data-action="copy-text" data-copy="' + encodeURIComponent(curlCmd) + '" data-label="cURL copied">' + icon('copy') + ' Copy cURL</button>' +
        '</div>' +
      '</div>';
    }
    function tabRequest(req) {
      return '<div class="dl-tabstack">' +
        headerRows(req.reqHeaders, state.settings.redactHeadersList, 'Headers', false) +
        (Object.keys(req.reqQuery || {}).length ? headerRows(req.reqQuery, state.settings.redactQueryList, 'Query params', true) : '') +
        '<div class="dl-ov-item"><div class="dl-ov-label">Body</div><div class="dl-body-wrap">' + bodyBlock(req, 'request') + '</div></div>' +
      '</div>';
    }
    function tabResponse(req) {
      return '<div class="dl-tabstack">' +
        headerRows(req.resHeaders, state.settings.redactHeadersList, 'Headers', false) +
        '<div class="dl-ov-item"><div class="dl-ov-label">Body</div><div class="dl-body-wrap">' + bodyBlock(req, 'response') + '</div></div>' +
      '</div>';
    }
    function tabTiming(req) {
      if (!req.timing) return '<p style="color:var(--dl-text-faint);font-size:12.5px;">No timing data for a pending request.</p>';
      var phases = [
        { key: 'dns', label: 'DNS lookup', color: '#4da3ff' }, { key: 'connect', label: 'Connect', color: '#36c976' },
        { key: 'tls', label: 'TLS handshake', color: '#b084f5' }, { key: 'send', label: 'Send', color: '#f3ab35' },
        { key: 'wait', label: 'Wait (TTFB)', color: '#f35468' }, { key: 'receive', label: 'Receive', color: '#5b8cff' }
      ];
      var total = phases.reduce(function (s, p) { return s + (req.timing[p.key] || 0); }, 0) || 1;
      return '<div class="dl-waterfall">' +
        '<div class="dl-wf-bar">' + phases.map(function (p) {
          var w = (req.timing[p.key] || 0) / total * 100;
          return w > 0 ? '<span class="dl-wf-seg" style="width:' + w + '%;background:' + p.color + '"></span>' : '';
        }).join('') + '</div>' +
        '<div class="dl-wf-legend">' + phases.map(function (p) {
          return '<div class="dl-wf-item"><span class="dl-wf-dot" style="background:' + p.color + '"></span><span class="lbl">' + p.label + '</span><span class="ms">' + fmtMs(req.timing[p.key] || 0) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="dl-wf-total"><span>Total</span><span>' + fmtMs(total) + '</span></div>' +
      '</div>';
    }
    function errorVariant(req) {
      return '<div class="dl-error-card">' +
          '<div class="et-type">' + icon('alert') + esc(req.error.type) + '</div>' +
          '<div class="et-msg">' + esc(req.error.message) + '</div>' +
        '</div>' +
        section('stack:' + req.id, 'Stack trace', null, '<div class="dl-stack">' + esc(req.error.stack) + '</div>');
    }

    function renderDetail() {
      var req = requests.find(function (r) { return r.id === state.activeId; });
      if (!req) { state.view = 'list'; return renderList(); }
      var statusBadge = req.statusClass === 'pending' ? '<span class="dl-badge cpending"><span class="dl-spinner"></span> PENDING</span>' :
        req.statusClass === 'error' ? '<span class="dl-badge cerror">' + icon('alert') + ' ERROR</span>' :
        '<span class="dl-badge c' + req.statusClass + '">' + statusLabel(req) + '</span>';
      var tabs = [
        { key: 'overview', label: 'Overview' }, { key: 'request', label: 'Request' },
        { key: 'response', label: 'Response' }
      ];
      var panel;
      if (state.tab === 'timing') state.tab = 'overview';
      if (req.statusClass === 'error' && state.tab === 'response') {
        panel = errorVariant(req);
      } else {
        panel = state.tab === 'overview' ? tabOverview(req) : state.tab === 'request' ? tabRequest(req) : tabResponse(req);
      }
      return '<div class="dl-screen od-screen">' +
        '<div class="dl-detail-header">' +
          '<div class="dl-dh-top">' +
            '<button type="button" class="dl-btn-icon" data-action="back-to-list" aria-label="Back to request list" style="margin-top:2px">' + icon('chevronLeft') + '</button>' +
            '<div class="dl-dh-url">' +
              '<div class="u-line1"><span class="dl-chip ' + req.method + '">' + req.method + '</span>' + statusBadge + '</div>' +
              '<div class="dl-dh-path">' + esc(req.path) + '</div>' +
              '<div class="dl-dh-host">' + esc(req.host) + (req.query ? '?' + esc(req.query) : '') + '</div>' +
            '</div>' +
            quickThemeToggleBtn('margin-top:2px') +
          '</div>' +
          '<div class="dl-dh-stats">' +
            '<span>' + icon('clock') + fmtMs(req.duration) + '</span>' +
            (req.resSize != null ? '<span>' + icon('server') + fmtBytes(req.resSize) + '</span>' : '') +
            '<span>' + icon('globe') + esc(req.protocol) + '</span>' +
          '</div>' +
          '<div class="dl-dh-actions">' +
            '<button type="button" class="dl-act-btn" data-action="share">' + icon('share') + ' Share</button>' +
            '<button type="button" class="dl-act-btn" data-action="copy-curl" data-id="' + req.id + '">' + icon('copy') + ' cURL</button>' +
            '<button type="button" class="dl-act-btn" data-action="replay" data-id="' + req.id + '">' + icon('replay') + ' Replay</button>' +
          '</div>' +
          '<div class="dl-tabs" role="tablist">' + tabs.map(function (t) {
            return '<button type="button" class="dl-tab" role="tab" aria-selected="' + (state.tab === t.key) + '" data-action="set-tab" data-tab="' + t.key + '">' + t.label + '</button>';
          }).join('') + '</div>' +
        '</div>' +
        '<div class="od-scroll"><div class="dl-tabpanel dl-enter" key="' + state.tab + '">' + panel + '</div></div>' +
      '</div>';
    }

    /* ---------------------------------------------------------------- render: stats */
    function donutSvg() {
      var r = 42, c = 2 * Math.PI * r, offset = 0, segs = '';
      STATS.distribution.forEach(function (d) {
        var len = c * (d.pct / 100);
        segs += '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + d.color + '" stroke-width="16" ' +
          'stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 60 60)"></circle>';
        offset += len;
      });
      return '<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Status code distribution donut chart">' + segs +
      '</svg>';
    }
    function rankList(items, valueKey, suffix, maxVal) {
      return '<div class="dl-rank-list">' + items.map(function (it) {
        var v = it[valueKey];
        var pct = Math.round(v / maxVal * 100);
        var warn = valueKey === 'avg' && v > 400;
        return '<div class="dl-rank-row">' +
          '<div class="dl-rank-top"><span class="path">' + esc(it.path || it.host) + '</span><span class="val">' + v + suffix + '</span></div>' +
          '<div class="dl-rank-track"><div class="dl-rank-fill' + (warn ? ' warn' : '') + '" style="width:' + pct + '%"></div></div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function renderStats() {
      var maxSlow = Math.max.apply(null, STATS.slowest.map(function (i) { return i.avg; }));
      var maxCalled = Math.max.apply(null, STATS.mostCalled.map(function (i) { return i.count; }));
      var maxHost = Math.max.apply(null, STATS.topHosts.map(function (i) { return i.count; }));
      return '<div class="dl-screen od-screen">' +
        topbar('Stats', { actions: '<button type="button" class="dl-btn-icon" data-action="open-popover" data-popover="overflow" aria-label="More options">' + icon('more') + '</button>' }) +
        '<div class="od-scroll">' +
          '<div class="dl-stats-grid dl-enter">' +
            '<div class="dl-stat-card"><div class="lbl">Total requests</div><div class="val">' + requests.length + '</div></div>' +
            '<div class="dl-stat-card"><div class="lbl">Success rate</div><div class="val ok">' + STATS.successRate + '%</div></div>' +
            '<div class="dl-stat-card"><div class="lbl">Avg latency</div><div class="val">' + STATS.avgLatency + ' ms</div></div>' +
            '<div class="dl-stat-card"><div class="lbl">p95 latency</div><div class="val">' + STATS.p95Latency + ' ms</div></div>' +
            '<div class="dl-stat-card"><div class="lbl">Data transferred</div><div class="val">' + STATS.totalData + '</div></div>' +
            '<div class="dl-stat-card"><div class="lbl">Error count</div><div class="val bad">' + STATS.errorCount + '</div></div>' +
          '</div>' +
          '<div class="dl-panel"><h2>Status code distribution</h2><div class="dl-donut-row">' + donutSvg() +
            '<div class="dl-legend">' + STATS.distribution.map(function (d) {
              return '<div class="dl-legend-item"><span class="dl-legend-dot" style="background:' + d.color + '"></span><span class="name">' + d.label + '</span><span class="pct">' + d.pct + '%</span></div>';
            }).join('') +
            '<div class="dl-legend-sep" role="separator"></div>' +
            '<div class="dl-legend-item total"><span class="name">Total requests</span><span class="pct">' + requests.length + '</span></div>' +
            '</div>' +
          '</div></div>' +
          '<div class="dl-panel">' +
            '<button type="button" class="dl-panel-head" data-action="open-rank-detail" data-kind="slowest"><h2>Slowest endpoints</h2>' + icon('chevronRight', 'chev') + '</button>' +
            rankList(STATS.slowest, 'avg', ' ms', maxSlow) +
          '</div>' +
          '<div class="dl-panel">' +
            '<button type="button" class="dl-panel-head" data-action="open-rank-detail" data-kind="largest"><h2>Largest responses</h2>' + icon('chevronRight', 'chev') + '</button>' +
            (function(){ var arr = computeLargest(); var maxv = arr[0]?arr[0].bytes:1; if(arr.length===0)return '<p style="color:var(--dl-text-faint);font-size:12px;">No response size data</p>'; return '<div class="dl-rank-list">' + arr.slice(0,3).map(function (it){ var pct=Math.round(it.bytes/maxv*100); return '<div class="dl-rank-row"><div class="dl-rank-top"><span class="path">'+esc(it.path)+'</span><span class="val">'+fmtBytes(it.bytes)+'</span></div><div class="dl-rank-track"><div class="dl-rank-fill" style="width:'+pct+'%"></div></div></div>'; }).join('') + '</div>'; })() +
          '</div>' +
          '<div class="dl-panel">' +
            '<button type="button" class="dl-panel-head" data-action="open-rank-detail" data-kind="mostCalled"><h2>Most-called endpoints</h2>' + icon('chevronRight', 'chev') + '</button>' +
            rankList(STATS.mostCalled, 'count', '×', maxCalled) +
          '</div>' +
          '<div class="dl-panel">' +
            '<button type="button" class="dl-panel-head" data-action="open-rank-detail" data-kind="topHosts"><h2>Top hosts</h2>' + icon('chevronRight', 'chev') + '</button>' +
            rankList(STATS.topHosts, 'count', '×', maxHost) +
          '</div>' +
        '</div>' +
        bottomNav('stats') +
      '</div>';
    }

    function computeLargest() {
      var m = {};
      requests.forEach(function(r){
        if(r.resSize != null){
          var k = r.path;
          if(!m[k] || r.resSize > m[k].size) m[k] = {path: k, bytes: r.resSize};
        }
      });
      var arr = Object.keys(m).map(function(k){ return m[k]; });
      arr.sort(function(a,b){ return b.bytes - a.bytes; });
      return arr;
    }
    var RANK_META = {
      slowest: { title: 'Slowest endpoints', items: 'slowestAll', valueKey: 'avg', suffix: ' ms', format: 'ms' },
      mostCalled: { title: 'Most-called endpoints', items: 'mostCalledAll', valueKey: 'count', suffix: '×', format: 'count' },
      largest: { title: 'Largest responses', items: 'largestAll', valueKey: 'bytes', suffix: '', format: 'bytes' },
      topHosts: { title: 'Top hosts', items: 'topHostsAll', valueKey: 'count', suffix: '×', format: 'count' }
    };
    function renderRankDetail() {
      var meta = RANK_META[state.rankKind];
      if (!meta) { state.view = 'stats'; return renderStats(); }
      var items = state.rankKind === 'largest' ? computeLargest() : STATS[meta.items];
      var maxVal = items.length ? Math.max.apply(null, items.map(function (i) { return i[meta.valueKey]; })) : 1;
      var listHtml = '<div class="dl-rank-list">' + items.map(function (it) {
        var v = it[meta.valueKey];
        var pct = Math.round(v / maxVal * 100);
        var display = meta.format === 'bytes' ? fmtBytes(v) : v + meta.suffix;
        return '<div class="dl-rank-row">' +
          '<div class="dl-rank-top"><span class="path">' + esc(it.path || it.host) + '</span><span class="val">' + display + '</span></div>' +
          '<div class="dl-rank-track"><div class="dl-rank-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
      }).join('') + '</div>';
      return '<div class="dl-screen od-screen">' +
        topbar(meta.title, { back: 'back-to-stats' }) +
        '<div class="od-scroll"><div class="dl-panel dl-enter" style="margin-top:12px;">' + listHtml + '</div></div>' +
      '</div>';
    }

    /* ---------------------------------------------------------------- settings sheet */
    function themeOpt(key, label, iconName) {
      var checked = state.settings.theme === key;
      return '<button type="button" class="dl-theme-opt" role="radio" aria-checked="' + checked + '" data-action="set-theme" data-theme="' + key + '">' + icon(iconName) + '<span>' + label + '</span></button>';
    }
    function switchEl(key, checked) {
      return '<button type="button" class="dl-switch" role="switch" aria-checked="' + checked + '" data-action="toggle-setting" data-key="' + key + '"><span class="knob"></span></button>';
    }
    function renderSettings() {
      var s = state.settings;
      var usedCount = requests.length;
      var usagePct = Math.min(100, Math.round(usedCount / s.maxStored * 100));
      var usageColor = usagePct >= 90 ? 'var(--dl-warn)' : 'var(--dl-accent)';
      var maxStoredInvalid = validateMaxStoredRaw(state.maxStoredDraft) === null;
      settingsBody.innerHTML =
        '<div class="dl-set-section"><h3>Appearance</h3><div class="dl-theme-row">' +
          themeOpt('light', 'Light', 'sun') + themeOpt('dark', 'Dark', 'moon') + themeOpt('system', 'System', 'monitor') +
        '</div></div>' +
        '<div class="dl-set-section"><h3>Capture</h3>' +
          '<div class="dl-set-row dl-set-row--col">' +
            '<div class="set-label"><div class="set-title">Max stored requests</div></div>' +
            '<div class="dl-stepper">' +
              '<button type="button" class="dl-stepper-btn" data-action="max-stored-step" data-dir="-1" aria-label="Decrease max stored requests">−</button>' +
              '<input type="text" inputmode="numeric" class="dl-stepper-input" id="dl-max-stored-input" value="' + esc(state.maxStoredDraft) + '" aria-label="Max stored requests" aria-describedby="dl-max-stored-help dl-max-stored-error">' +
              '<button type="button" class="dl-stepper-btn" data-action="max-stored-step" data-dir="1" aria-label="Increase max stored requests">+</button>' +
            '</div>' +
            '<div class="dl-max-stored-help" id="dl-max-stored-help">Oldest requests are removed once this limit is reached.</div>' +
            '<div class="dl-max-stored-error" id="dl-max-stored-error"' + (maxStoredInvalid ? '' : ' hidden') + '>Enter a number between 10 and 10,000</div>' +
            '<div class="dl-preset-rail">' +
              [100, 200, 500, 1000].map(function (v) {
                return '<button type="button" class="dl-preset-chip" aria-pressed="' + (s.maxStored === v) + '" data-action="max-stored-preset" data-value="' + v + '">' + v + '</button>';
              }).join('') +
            '</div>' +
            '<div class="dl-usage-row"><span>' + usedCount + ' of ' + s.maxStored + ' stored</span><span class="pct">' + usagePct + '%</span></div>' +
            '<div class="dl-usage-track"><div class="dl-usage-fill" style="width:' + usagePct + '%;background:' + usageColor + '"></div></div>' +
          '</div>' +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Retention</div><div class="set-desc">How long captured requests are kept on device</div></div>' +
            '<select class="dl-select" data-action="set-retention" aria-label="Retention period">' +
              [['session','This session'],['1h','1 hour'],['24h','24 hours'],['7d','7 days'],['always','Always']].map(function(v){ return '<option value="'+v[0]+'"'+(s.retention===v[0]?' selected':'')+'>'+v[1]+'</option>'; }).join('') +
            '</select></div>' +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Max body size</div><div class="set-desc">' + (s.maxBodyUnit === 'unlimited' ? 'Every body is kept whole' : 'Larger bodies are stored truncated') + '</div></div>' +
            '<div style="display:flex;gap:8px;align-items:center;">' +
              (s.maxBodyUnit === 'unlimited' ? '' : '<input type="text" inputmode="decimal" class="dl-stepper-input" style="width:84px;flex:none;height:34px;font-size:13px;" data-action="set-body-size" value="' + esc(String(s.maxBodySize)) + '" aria-label="Max body size">') +
              '<select class="dl-select" data-action="set-body-unit" aria-label="Max body size unit">' +
                [['B','B'],['KB','KB'],['MB','MB'],['unlimited','Unlimited']].map(function(v){ return '<option value="'+v[0]+'"'+(s.maxBodyUnit===v[0]?' selected':'')+'>'+v[1]+'</option>'; }).join('') +
              '</select>' +
            '</div></div>' +
        '</div>' +
        '<div class="dl-set-section"><h3>Entry point</h3>' +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Show notification</div><div class="set-desc">Persistent notification while capturing in the background</div></div>' + switchEl('notification', s.notification) + '</div>' +
          (s.notification ? '<div class="dl-set-row"><div class="set-label"><div class="set-title">Notification position</div><div class="set-desc">Top or bottom of screen</div></div>' +
            '<div class="dl-theme-group"><button type="button" class="dl-theme-opt" role="radio" aria-checked="' + (s.notificationPosition==='top') + '" data-action="set-notif-pos" data-pos="top">' + icon('arrowUp') + '<span>Top</span></button><button type="button" class="dl-theme-opt" role="radio" aria-checked="' + (s.notificationPosition==='bottom') + '" data-action="set-notif-pos" data-pos="bottom">' + icon('arrowDown') + '<span>Bottom</span></button></div>' +
          '</div>' : '') +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Notification duration</div><div class="set-desc">How long the finished-request alert stays on screen</div></div>' +
            '<div class="dl-mini-stepper">' +
              '<button type="button" class="dl-mini-step" data-action="notif-duration-step" data-dir="-1" aria-label="Decrease notification duration">−</button>' +
              '<span class="dl-mini-val">' + s.notificationDuration + 's</span>' +
              '<button type="button" class="dl-mini-step" data-action="notif-duration-step" data-dir="1" aria-label="Increase notification duration">+</button>' +
            '</div>' +
          '</div>' +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Show floating bubble</div><div class="set-desc">Tap-to-open bubble overlaid on your app</div></div>' + switchEl('bubble', s.bubble) + '</div>' +
          '<div class="dl-set-row dl-set-row--col">' +
            '<div class="set-label"><div class="set-title">Bubble position</div><div class="set-desc">Corner where the floating bubble sits on your app</div></div>' +
            '<div class="dl-pos-grid">' +
              [['tl', 'Top-left'], ['tr', 'Top-right'], ['bl', 'Bottom-left'], ['br', 'Bottom-right']].map(function (p) {
                return '<button type="button" class="dl-pos-opt" role="radio" aria-checked="' + (s.bubblePosition === p[0]) + '" data-action="set-bubble-position" data-position="' + p[0] + '">' + p[1] + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="dl-set-section"><h3>Privacy</h3>' +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Redact sensitive headers</div><div class="set-desc">Mask sensitive header values in the UI</div></div>' + switchEl('redactHeaders', s.redactHeaders) + '</div>' +
          (s.redactHeaders ? '<div class="dl-set-field"><div class="dl-set-field-label">Header keys to redact</div><input class="dl-set-input" type="text" data-action="set-redact-list" data-type="headers" value="' + esc((s.redactHeadersList||[]).join(', ')) + '" placeholder="authorization, cookie, x-api-key"></div>' : '') +
          '<div class="dl-set-row"><div class="set-label"><div class="set-title">Redact sensitive query params</div><div class="set-desc">Mask sensitive query parameter values</div></div>' + switchEl('redactQuery', s.redactQuery) + '</div>' +
          (s.redactQuery ? '<div class="dl-set-field"><div class="dl-set-field-label">Query keys to redact</div><input class="dl-set-input" type="text" data-action="set-redact-list" data-type="query" value="' + esc((s.redactQueryList||[]).join(', ')) + '" placeholder="token, apikey, password"></div>' : '') +
        '</div>' +
        '<div class="dl-set-section"><h3>Export</h3><div class="dl-export-row">' +
          '<button type="button" class="dl-act-btn" data-action="export" data-format="HAR">' + icon('download') + ' HAR</button>' +
          '<button type="button" class="dl-act-btn" data-action="export" data-format="JSON">' + icon('download') + ' JSON</button>' +
        '</div></div>';
    }

    /* ---------------------------------------------------------------- max stored requests: validation, commit, trim */
    function validateMaxStoredRaw(raw) {
      var trimmed = String(raw == null ? '' : raw).trim();
      if (!/^\d+$/.test(trimmed)) return null;
      var n = parseInt(trimmed, 10);
      if (n < 10 || n > 10000) return null;
      return n;
    }
    function updateMaxStoredDraft(raw) {
      state.maxStoredDraft = raw;
      var input = document.getElementById('dl-max-stored-input');
      var errEl = document.getElementById('dl-max-stored-error');
      var invalid = validateMaxStoredRaw(raw) === null;
      if (errEl) errEl.hidden = !invalid;
      if (input) input.classList.toggle('invalid', invalid);
    }
    function commitMaxStoredFromDraft() {
      var n = validateMaxStoredRaw(state.maxStoredDraft);
      if (n === null) {
        // Invalid: ignore it and snap back to the last valid value.
        state.maxStoredDraft = String(state.settings.maxStored);
        renderSettings();
        return;
      }
      if (n === state.settings.maxStored) { renderSettings(); return; }
      applyMaxStored(n);
    }
    function applyMaxStored(n) {
      n = Math.max(10, Math.min(10000, Math.round(n)));
      if (requests.length > n) {
        var excess = requests.length - n;
        var oldestFirst = requests.slice().sort(function (a, b) { return a.startTime < b.startTime ? -1 : a.startTime > b.startTime ? 1 : 0; });
        oldestFirst.slice(0, excess).forEach(function (victim) {
          var idx = requests.findIndex(function (r) { return r.id === victim.id; });
          if (idx !== -1) requests.splice(idx, 1);
        });
        toast('Trimmed ' + excess + ' oldest request' + (excess === 1 ? '' : 's'));
      }
      state.settings.maxStored = n;
      state.maxStoredDraft = String(n);
      renderSettings();
      render();
    }

    /* ---------------------------------------------------------------- swipe-to-delete */
    var swipeState = null;
    function bindSwipe() {
      Array.prototype.forEach.call(app.querySelectorAll('.dl-row-content'), function (el) {
        el.addEventListener('pointerdown', onSwipeStart);
      });
    }
    function onSwipeStart(e) {
      var wrap = e.currentTarget.closest('.dl-row-swipe');
      Array.prototype.forEach.call(app.querySelectorAll('.dl-row-content'), function (el) {
        if (el !== e.currentTarget) el.style.transform = '';
      });
      swipeState = { el: e.currentTarget, wrap: wrap, startX: e.clientX, dx: 0, moved: false };
      e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
      e.currentTarget.addEventListener('pointermove', onSwipeMove);
      e.currentTarget.addEventListener('pointerup', onSwipeEnd);
      e.currentTarget.addEventListener('pointercancel', onSwipeEnd);
    }
    function onSwipeMove(e) {
      if (!swipeState || swipeState.el !== e.currentTarget) return;
      var dx = e.clientX - swipeState.startX;
      if (Math.abs(dx) > 4) swipeState.moved = true;
      dx = Math.max(-84, Math.min(0, dx));
      swipeState.dx = dx;
      swipeState.el.style.transition = 'none';
      swipeState.el.style.transform = 'translateX(' + dx + 'px)';
    }
    function onSwipeEnd(e) {
      if (!swipeState || swipeState.el !== e.currentTarget) return;
      var el = swipeState.el, dx = swipeState.dx, moved = swipeState.moved;
      el.style.transition = 'transform .18s ease';
      el.style.transform = 'translateX(' + (dx < -40 ? -84 : 0) + 'px)';
      el.removeEventListener('pointermove', onSwipeMove);
      el.removeEventListener('pointerup', onSwipeEnd);
      el.removeEventListener('pointercancel', onSwipeEnd);
      if (moved) { el.dataset.swiped = (dx < -40) ? '1' : '0'; }
      swipeState = null;
      if (moved) e.preventDefault();
    }

    /* ---------------------------------------------------------------- render dispatch */
    function render(opts) {
      opts = opts || {};
      document.documentElement.setAttribute('data-theme', effectiveTheme());
      var focusId = opts.focusAfter || null;
      if (state.view === 'host') app.innerHTML = renderHost();
      else if (state.view === 'list') app.innerHTML = renderList();
      else if (state.view === 'detail') app.innerHTML = renderDetail();
      else if (state.view === 'stats') app.innerHTML = renderStats();
      else if (state.view === 'rank-detail') app.innerHTML = renderRankDetail();
      document.getElementById('dl-bubble-root').innerHTML = (state.view === 'host' && state.settings.bubble) ? renderBubble() : '';
      bindSwipe();
      if (focusId) {
        var target = app.querySelector('[data-row-trigger="' + focusId + '"]') || app.querySelector('.dl-btn-icon') || app.querySelector('button');
        if (target) target.focus();
      }
    }

    /* ---------------------------------------------------------------- settings dialog open/close */
    var settingsOpenerEl = null;
    function openSettings(opener) {
      settingsOpenerEl = opener || null;
      renderSettings();
      if (typeof settingsDialog.show === 'function') settingsDialog.show();
      else settingsDialog.setAttribute('open', '');
      var closeBtn = settingsDialog.querySelector('[data-action="close-settings"].dl-btn-icon');
      if (closeBtn) closeBtn.focus();
    }
    function closeSettings() {
      settingsDialog.close ? settingsDialog.close() : settingsDialog.removeAttribute('open');
      if (settingsOpenerEl && document.contains(settingsOpenerEl)) settingsOpenerEl.focus();
      settingsOpenerEl = null;
    }
    settingsDialog.addEventListener('cancel', function (e) { e.preventDefault(); closeSettings(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && settingsDialog.hasAttribute('open')) closeSettings();
    });

    /* ---------------------------------------------------------------- image preview dialog open/close */
    var imageDialog = document.getElementById('dl-image-dialog');
    var imageDialogBody = document.getElementById('dl-image-dialog-body');
    var imageDialogOpener = null;
    function openImagePreview(src, opener) {
      imageDialogOpener = opener || null;
      var filename = src.split('/').pop().split('?')[0] || src;
      imageDialogBody.innerHTML =
        '<div class="dl-image-ph" style="border-radius:14px;">' + icon('image') + '<span>Preview placeholder — image not fetched in this prototype</span></div>' +
        '<div class="dl-image-dialog-caption">' + esc(filename) + '</div>';
      if (typeof imageDialog.show === 'function') imageDialog.show();
      else imageDialog.setAttribute('open', '');
      var closeBtn = imageDialog.querySelector('[data-action="close-image-preview"].dl-btn-icon');
      if (closeBtn) closeBtn.focus();
    }
    function closeImagePreview() {
      imageDialog.close ? imageDialog.close() : imageDialog.removeAttribute('open');
      if (imageDialogOpener && document.contains(imageDialogOpener)) imageDialogOpener.focus();
      imageDialogOpener = null;
    }
    imageDialog.addEventListener('cancel', function (e) { e.preventDefault(); closeImagePreview(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && imageDialog.hasAttribute('open')) closeImagePreview();
    });

    /* ---------------------------------------------------------------- event delegation
       Delegated on document (not #dl-app) because the settings sheet and
       toasts mount in #dl-overlay-root, a sibling of #dl-app's ancestor. */
    document.addEventListener('click', function (e) {
      var swiped = e.target.closest('.dl-row-content');
      if (swiped && swiped.dataset.swiped === '1' && swiped.style.transform && swiped.style.transform !== 'translateX(0px)') {
        swiped.style.transform = 'translateX(0px)';
        swiped.dataset.swiped = '0';
        e.preventDefault();
        return;
      }
      var btn = e.target.closest('[data-action]');
      if (!btn) {
        if (state.popover && !e.target.closest('.dl-popover')) { state.popover = null; render(); }
        return;
      }
      var action = btn.dataset.action;
      switch (action) {
        case 'open-inspector':
          state.view = 'list'; render(); break;
        case 'minimize':
          state.view = 'host'; state.popover = null; render(); break;
        case 'simulate-request':
          simulateRequest(); break;
        case 'open-detail-from-notif':
          dismissNotification();
          state.view = 'detail'; state.activeId = btn.dataset.id; state.tab = 'overview'; state.popover = null;
          render(); break;
        case 'dismiss-notif':
          dismissNotification(); break;
        case 'nav':
          state.view = btn.dataset.view; state.popover = null; render(); break;
        case 'open-rank-detail':
          state.rankKind = btn.dataset.kind; state.view = 'rank-detail'; state.popover = null; render(); break;
        case 'back-to-stats':
          state.view = 'stats'; state.rankKind = null; render(); break;
        case 'open-detail':
          state.lastListFocusId = btn.dataset.id;
          state.view = 'detail'; state.activeId = btn.dataset.id; state.tab = 'overview'; state.popover = null;
          render({ focusAfter: null });
          var backBtn = app.querySelector('[data-action="back-to-list"]'); if (backBtn) backBtn.focus();
          break;
        case 'back-to-list':
          state.view = 'list'; render({ focusAfter: state.lastListFocusId }); break;
        case 'set-tab':
          state.tab = btn.dataset.tab; render(); break;
        case 'set-filter':
          state.filter = btn.dataset.filter; render(); break;
        case 'toggle-method':
          var m = btn.dataset.method;
          state.methodFilter.has(m) ? state.methodFilter.delete(m) : state.methodFilter.add(m);
          render(); break;
        case 'clear-method-filter':
          state.methodFilter.clear(); state.popover = null; render(); break;
        case 'open-search':
          state.searchOpen = true; render();
          var si = app.querySelector('[data-role="search-input"]'); if (si) si.focus();
          break;
        case 'close-search':
          state.searchOpen = false; state.search = ''; render(); break;
        case 'open-popover':
          state.popover = (state.popover === btn.dataset.popover) ? null : btn.dataset.popover; render(); break;
        case 'close-popover':
          state.popover = null; render(); break;
        case 'confirm-clear-all':
          requests.length = 0; state.popover = null; toast('All requests cleared'); render(); break;
        case 'delete-row':
          var idx = requests.findIndex(function (r) { return r.id === btn.dataset.id; });
          if (idx !== -1) requests.splice(idx, 1);
          toast('Request deleted'); render(); break;
        case 'toggle-section':
          state.openSections[btn.dataset.key] = !state.openSections[btn.dataset.key]; render(); break;
        case 'toggle-json':
          var set = state.openJsonPaths[btn.dataset.treeKey];
          set.has(btn.dataset.path) ? set.delete(btn.dataset.path) : set.add(btn.dataset.path);
          render(); break;
        case 'set-body-mode':
          state.bodyMode[btn.dataset.key] = btn.dataset.mode; render(); break;
        case 'copy-text':
          copyText(decodeURIComponent(btn.dataset.copy), btn.dataset.label); break;
        case 'copy-curl':
          var r1 = requests.find(function (r) { return r.id === btn.dataset.id; });
          if (r1) copyText(buildCurl(r1), 'cURL command copied');
          break;
        case 'replay':
          toast('Request replayed'); break;
        case 'share':
          toast('Share sheet opened'); break;
        case 'open-settings-from-menu':
          state.popover = null; render();
          openSettings(app.querySelector('[data-popover="overflow"]'));
          break;
        case 'close-settings':
          closeSettings(); break;
        case 'open-json-image':
          openImagePreview(btn.dataset.src, btn); break;
        case 'close-image-preview':
          closeImagePreview(); break;
        case 'set-theme':
          state.settings.theme = btn.dataset.theme; renderSettings(); render(); break;
        case 'quick-theme-toggle':
          state.settings.theme = THEME_CYCLE[state.settings.theme];
          if (settingsDialog.hasAttribute('open')) renderSettings();
          render();
          break;
        case 'max-stored-step':
          var stepCur = validateMaxStoredRaw(state.maxStoredDraft);
          if (stepCur === null) stepCur = state.settings.maxStored;
          applyMaxStored(stepCur + parseInt(btn.dataset.dir, 10) * 10);
          break;
        case 'max-stored-preset':
          applyMaxStored(parseInt(btn.dataset.value, 10));
          break;
        case 'notif-duration-step':
          state.settings.notificationDuration = Math.max(2, Math.min(15, state.settings.notificationDuration + parseInt(btn.dataset.dir, 10)));
          renderSettings();
          break;
        case 'set-notif-pos':
          state.settings.notificationPosition = btn.dataset.pos;
          renderSettings();
          break;
        case 'set-bubble-position':
          state.settings.bubblePosition = btn.dataset.position;
          renderSettings();
          render();
          break;
        case 'toggle-setting':
          var key = btn.dataset.key; state.settings[key] = !state.settings[key];
          renderSettings();
          if (key === 'notification' && !state.settings.notification) dismissNotification();
          if (key === 'redactHeaders' || key === 'redactQuery' || key === 'bubble') render();
          break;
        case 'export':
          toast('Exported session as ' + btn.dataset.format); state.popover = null; render(); break;
      }
    });

    app.addEventListener('input', function (e) {
        if (e.target.matches('[data-action="set-body-size"]')) {
          var size = parseFloat(e.target.value);
          e.target.classList.toggle('invalid', !(size > 0));
          if (size > 0) state.settings.maxBodySize = size;
          return;
        }
        if (e.target.matches('[data-action="set-redact-list"]')) {
          var t = e.target.dataset.type;
          var list = e.target.value.split(',').map(function(s){return s.trim().toLowerCase();}).filter(function(s){return s;});
          if (t === 'headers') state.settings.redactHeadersList = list;
          else if (t === 'query') state.settings.redactQueryList = list;
          render();
          return;
        }
        if (e.target.matches('[data-role="search-input"]')) {
          state.search = e.target.value;
          var scroller = app.querySelector('#dl-scroll');
        if (scroller) {
          // Replace only the scrollable list body (outerHTML reparses fresh
          // nodes, so swipe listeners must be rebound) — a full render()
          // would also work, but it would steal focus from this input on
          // every keystroke.
          scroller.outerHTML = renderListBodyOnly();
          bindSwipe();
        }
      }
    });
    function renderListBodyOnly() {
      var filtered = requests.filter(matchesFilters);
      var now = filtered.filter(function (r) { return r.group === 'now'; });
      var earlier = filtered.filter(function (r) { return r.group === 'earlier'; });
      var body;
      if (!filtered.length) {
        body = '<div class="dl-empty dl-enter">' + icon('search') + '<h3>No requests match this filter</h3><p>Try a different status, method, or search term.</p></div>';
      } else {
        body = '<div class="dl-list">' +
          (now.length ? '<div class="dl-group-label">Just now</div>' + now.map(function (r, i) { return renderRow(r, i); }).join('') : '') +
          (earlier.length ? '<div class="dl-group-label">Earlier</div>' + earlier.map(function (r, i) { return renderRow(r, i); }).join('') : '') +
        '</div>';
      }
      return '<div class="od-scroll" id="dl-scroll">' + body + '</div>';
    }

    document.addEventListener('change', function (e) {
      if (e.target.matches('[data-action="set-retention"]')) { state.settings.retention = e.target.value; }
      if (e.target.matches('[data-action="set-body-unit"]')) { state.settings.maxBodyUnit = e.target.value; renderSettings(); }
    });

    document.addEventListener('input', function (e) {
      if (e.target.id === 'dl-max-stored-input') updateMaxStoredDraft(e.target.value);
    });
    document.addEventListener('keydown', function (e) {
      if (e.target.id === 'dl-max-stored-input' && e.key === 'Enter') { e.preventDefault(); commitMaxStoredFromDraft(); }
    });
    document.addEventListener('focusout', function (e) {
      if (e.target.id === 'dl-max-stored-input') commitMaxStoredFromDraft();
    });

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (state.settings.theme === 'system') render();
      });
    }

    render();
  })();
  </script>
</body>
</html>
