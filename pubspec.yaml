name: dio_lens
description: >-
  In-app network inspector for Dio: browse captured requests, stats and details, replay requests, export HAR or JSON, and redact sensitive data.
version: 0.0.1
homepage: https://github.com/gktirkha/dio_lens
repository: https://github.com/gktirkha/dio_lens
issue_tracker: https://github.com/gktirkha/dio_lens/issues
topics:
  - dio
  - network
  - http
  - inspector
  - debugging

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

screenshots:
  - description: Request list with status and method filters.
    path: screenshots/requests.png
  - description: Request detail with a redacted header and a JSON body.
    path: screenshots/detail_request.png
  - description: Stats with latency, status distribution and rankings.
    path: screenshots/stats.png
  - description: Settings sheet.
    path: screenshots/settings.png
  - description: Request-finished banner over the host app.
    path: screenshots/banner.png
  - description: Request list in the light theme.
    path: screenshots/requests_light.png

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  shared_preferences_platform_interface: ^2.4.2

flutter:
